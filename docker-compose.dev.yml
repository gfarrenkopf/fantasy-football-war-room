# Local Postgres for developing hosted features. Not the production stack (see Epic 6).
#
#   docker compose -f docker-compose.dev.yml up -d
#   DATABASE_URL=postgres://warroom:warroom@localhost:5432/warroom
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: warroom
      POSTGRES_PASSWORD: warroom
      POSTGRES_DB: warroom
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warroom -d warroom"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db-data:
